<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Kalculator</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0f" />
    <!-- GitHub Pages serves this for a miss at any depth, so URLs here are
         root-relative (built from the deploy base) rather than relative to the
         requested path — correct at any depth, and portable to a custom domain. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%icons/favicon.ico" />
    <script async src="%BASE_URL%analytics.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: #0a0a0f; color: #eee;
        font-family: ui-monospace, 'DM Mono', 'SF Mono', Menlo, Consolas, monospace;
        display: flex; align-items: center; justify-content: center; padding: 24px;
      }
      .wrap { text-align: center; max-width: 380px; }
      .mark { width: 72px; height: 72px; margin: 0 auto 28px; display: block; }
      .code {
        font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
        color: #f472b6; margin-bottom: 14px;
      }
      h1 { font-size: 22px; font-weight: 600; color: #eee; margin-bottom: 10px; }
      p { font-size: 13px; line-height: 1.6; color: #777; margin-bottom: 28px; }
      a {
        display: inline-block; text-decoration: none; color: #fff;
        background: linear-gradient(135deg, #f472b6, #8b5cf6);
        border-radius: 10px; padding: 11px 26px; font-size: 14px; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="mark" src="%BASE_URL%icons/favicon.svg" alt="Kalculator" />
      <div class="code">Error 404</div>
      <h1>This one doesn't add up.</h1>
      <p>There's no page at that address. It may have moved, or the link may have a typo in it.</p>
      <a href="%BASE_URL%">Back to Kalculator</a>
    </div>
  </body>
</html>
