name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: npm install
      - run: npm run build
        env:
          # Public OAuth client ids for cloud save (repository variables).
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
